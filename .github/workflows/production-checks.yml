name: Production checks
on:
  pull_request:
  schedule:
    - cron: '0 1 * * 1' # weekly synthetic verification, Monday 09:00 Manila
  workflow_dispatch:
  push:
    branches: [main, production, restructure/module-architecture]
permissions:
  contents: read
concurrency:
  group: production-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.0', '24.19.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit
      - run: npm run typecheck
      - run: npm test
        env:
          TZ: Asia/Manila
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit
          path: |
            work/playwright-report/
            work/playwright-artifacts/
            work/playwright-results.json
          retention-days: 14
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high --prefix launcher
      - run: npm audit --audit-level=high --prefix mobile-app
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
