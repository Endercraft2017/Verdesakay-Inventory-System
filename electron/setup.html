<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Set up Verdesakay</title>
<style>
  :root { --fg:#1d2433; --muted:#5b6475; --bg:#f6f7fb; --card:#fff; --accent:#2b7fff; --danger:#d23b46; --line:#dde1ea; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e7eaf2; --muted:#9aa3b5; --bg:#12151c; --card:#1b1f29; --accent:#8aa0ff; --danger:#ff6b78; --line:#2c3240; } }
  body { margin:0; padding:24px; font:14px/1.5 system-ui,Segoe UI,sans-serif; color:var(--fg); background:var(--bg); }
  h1 { font-size:20px; margin:0 0 4px; } p { margin:4px 0 16px; color:var(--muted); }
  form, .card { background:var(--card); border-radius:12px; padding:20px; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  input[type=text], input[type=url], input[type=password] { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  .role { display:flex; gap:8px; align-items:flex-start; border:1px solid var(--line); border-radius:8px; padding:10px; margin:6px 0; font-weight:400; }
  .role small { display:block; color:var(--muted); }
  button { margin-top:18px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .hidden { display:none; }
  .fp { font-family:ui-monospace,Consolas,monospace; font-size:12px; word-break:break-all; background:var(--bg); padding:8px; border-radius:6px; }
  pre { white-space:pre-wrap; font-size:12px; max-height:180px; overflow:auto; background:var(--bg); padding:8px; border-radius:6px; }
  .error { color:var(--danger); font-weight:600; }
</style>
</head>
<body>
<h1>Set up this PC</h1>
<p>Once set up, this PC keeps working when the internet is down and syncs when it's back.</p>

<form id="form">
  <label for="cloud">Your workspace address</label>
  <input id="cloud" type="url" required placeholder="https://yourcompany.app.afkcube.com">

  <label>This PC is…</label>
  <label class="role"><input type="radio" name="role" value="host" checked>
    <span>The site's main PC <small>Stays on all day. Other PCs and phones at this site connect to it. Choose this too if it's the only PC at the site.</small></span></label>
  <label class="role"><input type="radio" name="role" value="pc">
    <span>Another PC at a site <small>Connects to the site's main PC on the office network.</small></span></label>

  <div id="host-box" class="hidden">
    <label for="host">The main PC's address on the office network</label>
    <input id="host" type="text" placeholder="192.168.1.20">
    <div id="host-check" class="hidden">
      <p>Check that this matches what the main PC's phone-setup page shows, then continue:</p>
      <div id="host-fp" class="fp"></div>
    </div>
  </div>

  <label for="name">Name for this PC</label>
  <input id="name" type="text" required maxlength="80" placeholder="Warehouse desk">

  <label for="user">Admin username</label>
  <input id="user" type="text" required autocomplete="username">
  <label for="pass">Password</label>
  <input id="pass" type="password" required autocomplete="current-password">

  <button id="go" type="submit">Set up</button>
  <div id="err" class="error hidden"></div>
</form>

<div id="progress" class="card hidden">
  <strong>Setting up…</strong>
  <pre id="log"></pre>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let hostCert = null;
  const role = () => document.querySelector('input[name=role]:checked').value;
  document.querySelectorAll('input[name=role]').forEach((r) => r.onchange = () => {
    $('host-box').classList.toggle('hidden', role() !== 'pc');
  });
  $('host').oninput = () => { hostCert = null; $('host-check').classList.add('hidden'); };
  window.desktopSetup.onLog((line) => { $('log').textContent += line; $('log').scrollTop = 1e9; });

  $('form').onsubmit = async (e) => {
    e.preventDefault();
    $('err').classList.add('hidden');
    $('go').disabled = true;
    try {
      if (role() === 'pc' && !hostCert) {
        hostCert = await window.desktopSetup.hostCertificate($('host').value);
        $('host-fp').textContent = hostCert.fingerprint;
        $('host-check').classList.remove('hidden');
        $('go').textContent = 'The fingerprint matches — set up';
        $('go').disabled = false;
        return;
      }
      $('form').classList.add('hidden');
      $('progress').classList.remove('hidden');
      const r = await window.desktopSetup.enrol({
        cloudUrl: $('cloud').value.trim(), role: role(), name: $('name').value.trim(),
        username: $('user').value.trim(), password: $('pass').value,
        hostAddress: hostCert && hostCert.host, hostCertificate: hostCert && hostCert.pem,
      });
      if (!r.ok) throw new Error('Setup did not finish — see the messages above.');
    } catch (ex) {
      $('form').classList.remove('hidden');
      $('err').textContent = ex.message;
      $('err').classList.remove('hidden');
      $('go').disabled = false;
    }
  };
</script>
</body>
</html>
