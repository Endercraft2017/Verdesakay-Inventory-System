<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2b7fff" />
  <title>Verdesakay Office System</title>
  <!-- Apply the saved/system theme before first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('vds_theme');
        var dark = saved ? saved === 'dark'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Login screen -->
  <div id="login-screen" class="login-wrap">
    <form class="login-card" id="login-form">
      <div class="login-brand">
        <div class="mark">V</div>
        <div>
          <h1>Verdesakay</h1>
          <div class="brand-sub">Office Management System</div>
        </div>
      </div>
      <div id="login-error" class="form-error hidden"></div>
      <label for="login-username">Username</label>
      <input id="login-username" name="username" autocomplete="username" required autofocus />
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required />
      <button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:20px;">Sign in</button>
      <button type="button" id="forgot-link" class="btn-link" style="display:block;margin:12px auto 0;background:none;border:none;color:var(--accent,#2b7fff);cursor:pointer;font-size:13px">Forgot password?</button>
    </form>
  </div>

  <!-- Application shell (ECOUNT-style chrome): utility bar, top primary menu,
       secondary sub-tab row, then a workspace of tree | view | icon rail. -->
  <div id="app-screen" class="app hidden">
    <!-- Utility bar: menu search + site map -->
    <div class="util-bar">
      <div class="menu-search">
        <input id="menu-search" type="search" placeholder="Search Menu" autocomplete="off" />
        <div class="menu-search-results hidden" id="menu-search-results"></div>
      </div>
      <button class="sitemap-btn" id="sitemap-btn">Site Map</button>
      <div class="grow"></div>
      <button class="icon-btn pin-btn" id="pin-btn" title="Pinned" aria-label="Pinned"></button>
    </div>

    <!-- Top primary menu -->
    <header class="topnav">
      <div class="brand">
        <div class="mark">V</div>
        <div class="name">Verdesakay<small>Office System</small></div>
      </div>
      <nav class="primary-nav" id="primary-nav"></nav>
      <div class="grow"></div>
      <div class="topnav-user">
        <div class="who">
          <div class="name" id="me-name">—</div>
          <div class="role"><span id="me-role"></span> · <span id="me-dept"></span></div>
        </div>
        <div class="avatar" id="me-avatar">—</div>
      </div>
    </header>

    <!-- Secondary sub-tab row -->
    <nav class="subnav" id="subnav"></nav>

    <!-- Workspace: tree | main view | icon rail -->
    <div class="workspace">
      <aside class="tree" id="tree-nav"></aside>
      <main class="main" id="view"></main>
      <aside class="rail" id="rail">
        <button class="rail-btn" id="rail-messages" data-route="messages" title="Messages" aria-label="Messages">
          <span class="badge hidden" id="msg-badge">0</span>
        </button>
        <button class="rail-btn" data-tool="ai" title="AI Assistant" aria-label="AI Assistant"></button>
        <button class="rail-btn" data-tool="notes" title="Notes" aria-label="Notes"></button>
        <button class="rail-btn" data-tool="email" title="Email" aria-label="Email"></button>
        <button class="rail-btn" data-tool="scheduler" title="Scheduler" aria-label="Scheduler"></button>
        <button class="rail-btn" data-tool="bookmarks" title="Bookmarks" aria-label="Bookmarks"></button>
        <div class="rail-spacer"></div>
        <button class="rail-btn" data-tool="help" title="Help &amp; explainers" aria-label="Help"></button>
        <button class="rail-btn rail-avatar" id="rail-account" data-route="account" title="My Account" aria-label="My Account"></button>
        <button class="rail-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme"></button>
        <button class="rail-btn" id="logout-btn" title="Sign out" aria-label="Sign out"></button>
      </aside>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="toasts"></div>

  <!-- Core (api, ui) then App (defines the router/registry) BEFORE the view modules,
       since each view calls App.register(...) at load time. -->
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/nav-config.js"></script>
  <script src="/js/currencies.js"></script>
  <script src="/js/item-form-config.js"></script>
  <script src="/js/lib/barcode.js"></script>
  <script src="/js/doc-formula.js"></script>
  <script src="/js/doc-template.js"></script>
  <script src="/js/doc-context.js"></script>
  <script src="/js/vendor/codemirror-bundle.js"></script>
  <script src="/js/doc-editor.js"></script>
  <script src="/js/hr-payroll-print.js"></script>
  <script src="/js/help.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/analytics.js"></script>
  <script src="/js/views/accounting.js"></script>
  <script src="/js/views/accounting-petty-cash.js"></script>
  <script src="/js/views/accounting-ledger.js"></script>
  <script src="/js/views/inventory.js"></script>
  <script src="/js/views/inventory-movements.js"></script>
  <script src="/js/views/suppliers.js"></script>
  <script src="/js/views/locations.js"></script>
  <script src="/js/views/finished-products.js"></script>
  <script src="/js/views/job-orders.js"></script>
  <script src="/js/views/activity.js"></script>
  <script src="/js/views/forms.js"></script>
  <script src="/js/views/orders.js"></script>
  <script src="/js/views/purchasing.js"></script>
  <script src="/js/views/templates.js"></script>
  <script src="/js/views/messages.js"></script>
  <script src="/js/views/admin.js"></script>
  <script src="/js/views/account.js"></script>
  <script src="/js/views/form-builder.js"></script>
  <script src="/js/views/form-records.js"></script>
  <script src="/js/views/hr.js"></script>
  <script src="/js/views/hr-employees.js"></script>
  <script src="/js/views/hr-timekeeping.js"></script>
  <script src="/js/views/hr-kiosk.js"></script>
  <script src="/js/views/announcements.js"></script>
  <script src="/js/tools.js"></script>
</body>
</html>
