<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script src="/js/tenant-context.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2b7fff" />
  <title>Verdesakay Office System</title>
  <!-- Apply the saved/system theme before first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('vds_theme');
        var dark = saved ? saved === 'dark'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/visual-refresh.css" />
</head>
<body>
  <!-- Login screen -->
  <div id="login-screen" class="login-wrap">
    <form class="login-card" id="login-form">
      <div class="login-brand">
        <div class="mark">V</div>
        <div>
          <h1>Verdesakay</h1>
          <div class="brand-sub">Office Management System</div>
        </div>
      </div>
      <div id="login-error" class="form-error hidden"></div>
      <label for="login-username">Username</label>
      <input id="login-username" name="username" autocomplete="username" required autofocus />
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required />
      <label for="login-shared" style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-weight:400;cursor:pointer">
        <input id="login-shared" type="checkbox" style="width:auto;margin:2px 0 0" />
        <span>This is a shared or borrowed computer
          <span class="muted" style="display:block;font-size:12px">Signs you out after 30 minutes idle or when you close the tab.</span></span>
      </label>
      <button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:20px;">Sign in</button>
      <button type="button" id="forgot-link" class="btn-link" style="display:block;margin:12px auto 0;background:none;border:none;color:var(--accent,#2b7fff);cursor:pointer;font-size:13px">Forgot username or password?</button>
    </form>
  </div>

  <!-- Application shell (ECOUNT-style chrome): utility bar, top primary menu,
       secondary sub-tab row, then a workspace of tree | view | icon rail. -->
  <div id="app-screen" class="app hidden">
    <!-- Utility bar: menu search + site map -->
    <div class="util-bar">
      <div class="menu-search">
        <input id="menu-search" type="search" placeholder="Search Menu" autocomplete="off" />
        <div class="menu-search-results hidden" id="menu-search-results"></div>
      </div>
      <button class="sitemap-btn" id="sitemap-btn">Site Map</button>
      <div class="grow"></div>
      <button class="icon-btn pin-btn" id="pin-btn" title="Pinned" aria-label="Pinned"></button>
    </div>

    <!-- Top primary menu -->
    <header class="topnav">
      <div class="brand">
        <div class="mark">V</div>
        <div class="name">Verdesakay<small>Office System</small></div>
      </div>
      <nav class="primary-nav" id="primary-nav"></nav>
      <div class="grow"></div>
      <div class="topnav-user">
        <div class="who">
          <div class="name" id="me-name">—</div>
          <div class="role"><span id="me-role"></span> · <span id="me-dept"></span></div>
        </div>
        <div class="avatar" id="me-avatar">—</div>
      </div>
    </header>

    <!-- Secondary sub-tab row -->
    <nav class="subnav" id="subnav"></nav>

    <!-- Workspace: tree | main view | icon rail -->
    <div class="workspace">
      <aside class="tree" id="tree-nav"></aside>
      <main class="main" id="view"></main>
      <aside class="rail" id="rail">
        <div class="rail-top">
          <button class="rail-btn" id="rail-messages" data-route="messages" title="Messages" aria-label="Messages">
            <span class="badge hidden" id="msg-badge">0</span>
          </button>
          <button class="rail-btn" id="rail-notifications" title="Notifications" aria-label="Notifications">
            <span class="badge hidden" id="notif-badge">0</span>
          </button>
          <button class="rail-btn" data-tool="notes" title="Notes" aria-label="Notes"></button>
          <button class="rail-btn" data-tool="email" title="Email" aria-label="Email"></button>
          <button class="rail-btn" data-tool="scheduler" title="Scheduler" aria-label="Scheduler"></button>
          <button class="rail-btn" data-tool="bookmarks" title="Bookmarks" aria-label="Bookmarks"></button>
          <button class="rail-btn" data-tool="bug" title="Report a Bug" aria-label="Report a Bug">
            <span class="badge hidden" id="bug-badge">0</span>
          </button>
        </div>
        <div class="rail-bottom">
          <button class="rail-btn" data-tool="help" title="Help &amp; explainers" aria-label="Help"></button>
          <button class="rail-btn rail-avatar" id="rail-account" data-route="account" title="My Account" aria-label="My Account"></button>
          <button class="rail-btn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme"></button>
          <button class="rail-btn" id="logout-btn" title="Sign out" aria-label="Sign out"></button>
        </div>
      </aside>
    </div>

    <!-- Floating AI chat widget: a corner bubble that opens a small fixed-size panel,
         independent of the right-rail .drawer system (see tools.js). Lives inside
         #app-screen so it hides/shows with the rest of the shell on logout/login. -->
    <button class="ai-fab" id="ai-fab" title="AI Assistant" aria-label="AI Assistant"></button>
    <div id="ai-widget-root"></div>
  </div>

  <div id="modal-root"></div>
  <div id="drawer-root"></div>
  <div id="toasts"></div>
