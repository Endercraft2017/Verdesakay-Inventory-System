<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verdesakay Office System</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Login screen -->
  <div id="login-screen" class="login-wrap">
    <form class="login-card" id="login-form">
      <h1>Verdesakay</h1>
      <div class="brand-sub">Office Management System</div>
      <div id="login-error" class="form-error hidden"></div>
      <label for="login-username">Username</label>
      <input id="login-username" name="username" autocomplete="username" required autofocus />
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required />
      <button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:18px;">Sign in</button>
    </form>
  </div>

  <!-- Application shell -->
  <div id="app-screen" class="app hidden">
    <nav class="sidebar">
      <div class="logo">Verdesakay<small>Office System</small></div>
      <button class="nav-item" data-route="dashboard">📊 Dashboard</button>
      <button class="nav-item" data-route="inventory">📦 Inventory</button>
      <button class="nav-item" data-route="forms">📁 Forms &amp; Files</button>
      <button class="nav-item" data-route="messages">✉️ Messages <span class="badge hidden" id="msg-badge">0</span></button>
      <button class="nav-item admin-only" data-route="admin">👥 Accounts</button>
      <div class="spacer"></div>
      <button class="nav-item" data-route="account">⚙️ My Account</button>
      <div class="user-box">
        <div class="name" id="me-name">—</div>
        <div class="role"><span id="me-role"></span> · <span id="me-dept"></span></div>
        <button class="nav-item" id="logout-btn" style="margin-top:8px;">🚪 Sign out</button>
      </div>
    </nav>
    <main class="main" id="view"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toasts"></div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/inventory.js"></script>
  <script src="/js/views/forms.js"></script>
  <script src="/js/views/messages.js"></script>
  <script src="/js/views/admin.js"></script>
  <script src="/js/views/account.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
