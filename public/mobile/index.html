<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#2b7fff" />
  <title>Verdesakay Warehouse</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('vds_theme');
        var dark = saved ? saved === 'dark'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/mobile/mobile.css" />
</head>
<body>
  <!-- Login -->
  <div id="m-login" class="m-screen m-login hidden">
    <form class="m-card" id="m-login-form">
      <div class="m-brand">
        <div class="m-mark">V</div>
        <h1>Verdesakay</h1>
        <div class="m-sub">Warehouse</div>
      </div>
      <div id="m-login-error" class="m-error hidden"></div>
      <label for="m-username">Username</label>
      <input id="m-username" name="username" autocomplete="username" required autofocus />
      <label for="m-password">Password</label>
      <input id="m-password" name="password" type="password" autocomplete="current-password" required />
      <button class="m-btn" type="submit">Sign in</button>
    </form>
  </div>

  <!-- App -->
  <div id="m-app" class="hidden">
    <header class="m-topbar">
      <button class="m-back hidden" id="m-back" aria-label="Back" title="Back">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="m-title" id="m-title">Warehouse</div>
      <button class="m-signout" id="m-settings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.14.31.22.65.22 1s-.08.69-.22 1z"/></svg>
      </button>
    </header>
    <main class="m-view" id="m-view"></main>
  </div>

  <div id="m-overlay-root"></div>
  <div id="m-toasts"></div>

  <script src="/js/api.js"></script>
  <script src="/mobile/vendor/qrcode.js"></script>
  <script src="/mobile/vendor/zxing.js"></script>
  <script src="/mobile/app.js"></script>
  <script src="/mobile/lib/dom.js"></script>
  <script src="/mobile/lib/locations.js"></script>
  <script src="/mobile/lib/users.js"></script>
  <script src="/mobile/lib/stats.js"></script>
  <script src="/mobile/lib/recent.js"></script>
  <script src="/mobile/lib/photo.js"></script>
  <script src="/mobile/lib/scanner.js"></script>
  <script src="/mobile/lib/item-picker.js"></script>
  <script src="/mobile/views/home.js"></script>
  <script src="/mobile/views/stock-move.js"></script>
  <script src="/mobile/views/damage.js"></script>
  <script src="/mobile/views/transfer.js"></script>
  <script src="/mobile/views/new-item.js"></script>
  <script src="/mobile/views/assign-qr.js"></script>
  <script src="/mobile/views/scan.js"></script>
  <script src="/mobile/views/item-detail.js"></script>
  <script src="/mobile/views/low-stock.js"></script>
  <script src="/mobile/views/location-view.js"></script>
  <script src="/mobile/views/my-log.js"></script>
  <script src="/mobile/views/cycle-count.js"></script>
  <script src="/mobile/views/orders-fulfil.js"></script>
  <script src="/mobile/views/batch-move.js"></script>
  <script src="/mobile/views/job-orders.js"></script>
  <script src="/mobile/views/qc.js"></script>
  <script src="/mobile/views/report-problem.js"></script>
  <script src="/mobile/views/settings.js"></script>
</body>
</html>
