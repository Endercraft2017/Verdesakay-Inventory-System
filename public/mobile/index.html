<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <script src="/js/tenant-context.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1b6b46" />
  <title>Otom Mobile</title>
  <link rel="manifest" href="/mobile/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/mobile/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Warehouse" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('vds_theme');
        var dark = saved ? saved === 'dark'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/mobile/mobile.css" />
  <link rel="stylesheet" href="/mobile/mobile-v2.css" />
  <link rel="stylesheet" href="/css/photo-viewer.css" />
  <link rel="stylesheet" href="/mobile/guides.css" />
  <link rel="stylesheet" href="/mobile/role-kit.css" />
  <link rel="stylesheet" href="/css/select-controls.css" />
</head>
<body>
  <!-- Login -->
  <div id="m-login" class="m-screen m-login hidden">
    <form class="m-card" id="m-login-form">
      <div class="m-brand">
        <div class="m-mark">O</div>
        <h1>Otom</h1>
        <div class="m-sub">Warehouse · by AFKcube</div>
      </div>
      <div id="m-login-error" role="alert" tabindex="-1" class="m-error hidden"></div>
      <label for="m-username">Username</label>
      <input id="m-username" name="username" autocomplete="username" required autofocus />
      <label for="m-password">Password</label>
      <input id="m-password" name="password" type="password" autocomplete="current-password" required />
      <label class="m-shared-opt" for="m-shared">
        <input id="m-shared" type="checkbox" />
        <span><b>I'm using someone else's phone</b>
          <small>Signs you out after 30 minutes idle or when the app closes. Notifications stay off.</small></span>
      </label>
      <button class="m-btn" type="submit">Sign in</button>
      <p id="m-login-status" class="auth-status" role="status"></p>
      <a class="m-recovery" id="m-recovery" href="/index.html?recover=1">Forgot username or password?</a>
    </form>
  </div>

  <!-- App -->
  <div id="m-app" class="hidden">
    <header class="m-topbar">
      <button class="m-icbtn m-back hidden" id="m-back" aria-label="Back" title="Back">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="m-ctx">
        <div class="m-ctx-line">
          <span id="m-ctx-role">Warehouse</span>
          <span class="m-ctx-sep">·</span><span id="m-ctx-place">Main</span>
          <span class="m-ctx-dot" id="m-ctx-dot"></span><span id="m-ctx-status">Online</span>
        </div>
        <div class="m-title" id="m-title">Home</div>
      </div>
      <button type="button" class="m-icbtn" id="m-guide-start" aria-label="Start guide for this screen">Guide</button>
      <button class="m-icbtn m-top-notifications" id="m-notifications-top" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
        <span class="m-notification-dot hidden" id="m-notification-dot"></span>
      </button>
      <button class="m-icbtn m-top-sync" id="m-qbadge" aria-label="Sync queue" title="Sync queue">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10a5 5 0 0 0-4.9-4A6 6 0 0 0 2 8.5 4.5 4.5 0 0 0 6.5 18H18a4 4 0 0 0 0-8z"/></svg>
        <span class="m-sync-n" id="m-qcount">0</span>
      </button>
    </header>

    <!-- Borrowed-phone sign-in (app.js paintSharedBanner) -->
    <div class="m-shared-banner hidden" id="m-shared-banner" role="status">
      <span>Borrowed phone · signs out after 30 min idle or when you close the app</span>
      <button type="button" class="m-btn m-btn-sm" data-shared-out>Sign out</button>
    </div>

    <nav class="m-segments hidden" id="m-segments">
      <button data-seg="me">Me</button>
      <button data-seg="approvals">Approvals</button>
      <button data-seg="people">People</button>
      <button data-seg="warehouse">Warehouse</button>
    </nav>

    <main class="m-view" id="m-view"></main>

    <nav class="m-tabbar" id="m-tabbar" aria-label="Primary navigation">
      <button class="m-tab m-tab-fab" data-tab="home" id="m-fab">
        <span class="m-fab-in"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>
        <span class="m-fab-lbl">Home</span>
      </button>
      <button class="m-tab" data-tab="work">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 3H8z"/><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 12h18"/></svg>
        <span>Work</span>
      </button>
      <button class="m-tab" data-tab="clock">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span>Clock</span>
      </button>
      <button class="m-tab" data-tab="inbox">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="m4 7 8 6 8-6"/></svg>
        <span>Inbox</span><span class="m-badge hidden" id="m-tab-inbox-badge">0</span>
      </button>
      <button class="m-tab" data-tab="profile">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <div id="m-overlay-root"></div>
  <div id="m-toasts"></div>
