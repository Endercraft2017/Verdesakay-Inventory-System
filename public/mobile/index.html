<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#2b7fff" />
  <title>Verdesakay Warehouse</title>
  <link rel="manifest" href="/mobile/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/mobile/icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Warehouse" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('vds_theme');
        var dark = saved ? saved === 'dark'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/mobile/mobile.css" />
</head>
<body>
  <!-- Login -->
  <div id="m-login" class="m-screen m-login hidden">
    <form class="m-card" id="m-login-form">
      <div class="m-brand">
        <div class="m-mark">V</div>
        <h1>Verdesakay</h1>
        <div class="m-sub">Warehouse</div>
      </div>
      <div id="m-login-error" class="m-error hidden"></div>
      <label for="m-username">Username</label>
      <input id="m-username" name="username" autocomplete="username" required autofocus />
      <label for="m-password">Password</label>
      <input id="m-password" name="password" type="password" autocomplete="current-password" required />
      <button class="m-btn" type="submit">Sign in</button>
    </form>
  </div>

  <!-- App -->
  <div id="m-app" class="hidden">
    <header class="m-topbar">
      <button class="m-icbtn m-back hidden" id="m-back" aria-label="Back" title="Back">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="m-ctx">
        <div class="m-ctx-line">
          <span id="m-ctx-role">Warehouse</span>
          <span class="m-ctx-sep">·</span><span id="m-ctx-place">Main</span>
          <span class="m-ctx-dot" id="m-ctx-dot"></span><span id="m-ctx-status">Online</span>
        </div>
        <div class="m-title" id="m-title">Home</div>
      </div>
      <button class="m-icbtn m-top-inbox" id="m-inbox-top" aria-label="Inbox">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="M4 8h4l2 3h4l2-3h4"/></svg>
        <span class="m-badge hidden" id="m-inbox-badge">0</span>
      </button>
      <button class="m-icbtn m-top-sync" id="m-qbadge" aria-label="Sync queue" title="Sync queue">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10a5 5 0 0 0-4.9-4A6 6 0 0 0 2 8.5 4.5 4.5 0 0 0 6.5 18H18a4 4 0 0 0 0-8z"/></svg>
        <span class="m-sync-n" id="m-qcount">0</span>
      </button>
    </header>

    <nav class="m-segments hidden" id="m-segments">
      <button data-seg="me">Me</button>
      <button data-seg="approvals">Approvals</button>
      <button data-seg="people">People</button>
      <button data-seg="warehouse">Warehouse</button>
    </nav>

    <main class="m-view" id="m-view"></main>

    <nav class="m-tabbar" id="m-tabbar">
      <button class="m-tab" data-tab="work">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l1 3H8z"/><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 12h18"/></svg>
        <span>Work</span>
      </button>
      <button class="m-tab" data-tab="action" id="m-action">
        <span class="m-action-ic" id="m-action-icon"></span>
        <span id="m-action-lbl">Scan</span>
      </button>
      <button class="m-tab m-tab-fab" data-tab="home" id="m-fab">
        <span class="m-fab-in">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        </span>
        <span class="m-fab-lbl">Home</span>
      </button>
      <button class="m-tab" data-tab="inbox">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="m4 7 8 6 8-6"/></svg>
        <span>Inbox</span>
        <span class="m-badge hidden" id="m-tab-inbox-badge">0</span>
      </button>
      <button class="m-tab" data-tab="profile">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <div id="m-overlay-root"></div>
  <div id="m-toasts"></div>

  <script src="/js/api.js"></script>
  <script src="/mobile/vendor/qrcode.js"></script>
  <script src="/mobile/vendor/zxing.js"></script>
  <script src="/mobile/app.js"></script>
  <script src="/mobile/lib/dom.js"></script>
  <script src="/mobile/lib/locations.js"></script>
  <script src="/mobile/lib/users.js"></script>
  <script src="/mobile/lib/stats.js"></script>
  <script src="/mobile/lib/recent.js"></script>
  <script src="/mobile/lib/photo.js"></script>
  <script src="/mobile/lib/queue.js"></script>
  <script src="/mobile/lib/push.js"></script>
  <script src="/mobile/lib/scanner.js"></script>
  <script src="/mobile/lib/item-picker.js"></script>
  <script src="/mobile/views/home.js"></script>
  <script src="/mobile/views/work.js"></script>
  <script src="/mobile/views/stock-move.js"></script>
  <script src="/mobile/views/damage.js"></script>
  <script src="/mobile/views/transfer.js"></script>
  <script src="/mobile/views/new-item.js"></script>
  <script src="/mobile/views/assign-qr.js"></script>
  <script src="/mobile/views/scan.js"></script>
  <script src="/mobile/views/item-detail.js"></script>
  <script src="/mobile/views/low-stock.js"></script>
  <script src="/mobile/views/location-view.js"></script>
  <script src="/mobile/views/my-log.js"></script>
  <script src="/mobile/views/cycle-count.js"></script>
  <script src="/mobile/views/orders-fulfil.js"></script>
  <script src="/mobile/views/batch-move.js"></script>
  <script src="/mobile/views/job-orders.js"></script>
  <script src="/mobile/views/qc.js"></script>
  <script src="/mobile/views/allocate.js"></script>
  <script src="/mobile/views/report-problem.js"></script>
  <script src="/mobile/views/settings.js"></script>
  <script src="/mobile/views/queue-view.js"></script>
  <script src="/mobile/views/clock.js"></script>
  <script src="/mobile/views/inbox.js"></script>
  <script src="/mobile/views/directory.js"></script>
  <script src="/mobile/views/payslips.js"></script>
  <script src="/mobile/views/schedule.js"></script>
  <script src="/mobile/views/requests.js"></script>
  <script src="/mobile/views/tasks.js"></script>
  <script src="/mobile/views/announcements.js"></script>
  <script src="/mobile/views/time-fix.js"></script>
  <script src="/mobile/views/approvals.js"></script>
</body>
</html>
