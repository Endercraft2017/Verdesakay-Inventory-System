<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2b7fff" />
  <title>Verdesakay Mobile</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('vds_theme');
        var dark = saved ? saved === 'dark'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/mobile/mobile.css" />
</head>
<body>
  <!-- Login -->
  <div id="m-login" class="m-screen m-login hidden">
    <form class="m-card" id="m-login-form">
      <div class="m-brand">
        <div class="m-mark">V</div>
        <h1>Verdesakay</h1>
        <div class="m-sub">Mobile</div>
      </div>
      <div id="m-login-error" class="m-error hidden"></div>
      <label for="m-username">Username</label>
      <input id="m-username" name="username" autocomplete="username" required autofocus />
      <label for="m-password">Password</label>
      <input id="m-password" name="password" type="password" autocomplete="current-password" required />
      <button class="m-btn" type="submit">Sign in</button>
    </form>
  </div>

  <!-- Home: just the account holder's name, centered -->
  <div id="m-home" class="m-screen m-home hidden">
    <button class="m-logout" id="m-logout">Sign out</button>
    <div class="m-name-wrap">
      <div class="m-hello">Signed in as</div>
      <div class="m-name" id="m-name">—</div>
      <div class="m-meta" id="m-meta"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/mobile/mobile.js"></script>
</body>
</html>
