<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OTOM · Owner console</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #1c2430; --muted: #67707d; --line: #e2e5ea;
    --accent: #2f6feb; --accent-ink: #fff; --danger: #d64545; --ok: #2e7d46; --warn: #b8860b;
    --chip: #eef1f6; --shadow: 0 1px 2px rgba(20,30,45,.06), 0 8px 24px rgba(20,30,45,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a; --panel: #1b1f26; --ink: #e7eaef; --muted: #97a0ac; --line: #2b313b;
      --accent: #5b8cf5; --chip: #262b34; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  button { font: inherit; cursor: pointer; }
  input, select { font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 7px;
    padding: 8px 14px; font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: var(--danger); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  /* login */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  #login .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 28px; width: 100%; max-width: 360px; }
  #login h1 { font-size: 17px; margin: 0 0 4px; }
  #login label { display: block; font-size: 12px; font-weight: 600; margin: 14px 0 5px; }
  #login .btn { width: 100%; margin-top: 18px; }
  .err { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 18px; }

  /* shell */
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 15px; margin: 0; flex: 1; }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }
  .toolbar input { max-width: 240px; }

  table { width: 100%; border-collapse: collapse; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--bg); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--chip); }
  tbody tr:last-child td { border-bottom: 0; }
  td.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .badge.active { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .badge.trial { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .badge.past_due, .badge.suspended { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
  .chip { display: inline-block; background: var(--chip); border-radius: 6px; padding: 1px 7px;
    font-size: 11.5px; margin: 1px 3px 1px 0; }
  .chip.ovr { outline: 1px solid var(--accent); }

  .modal .card.subscription-card { max-width: 760px; max-height: 90vh; overflow-y: auto; }
  .subscription-modules { display: grid; gap: 10px; margin-bottom: 18px; }
  .subscription-module { display: grid; grid-template-columns: 1fr 180px; gap: 16px; align-items: center; }
  .subscription-module label { display: flex; align-items: center; gap: 8px; }
  .subscription-module input[type="checkbox"] { width: auto; }
  .subscription-quote { font-weight: 600; }
  @media (max-width: 480px) { .subscription-module { grid-template-columns: 1fr 120px; } }
  .modal .card.analytics-card { max-width: 1000px; max-height: 92vh; overflow-y: auto; }
  .analytics-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .analytics-section { margin:24px 0; border-top:1px solid var(--line); padding-top:12px; }
  .analytics-section h3 { margin:0 0 12px; }
  .analytics-table { overflow-x:auto; }
  .analytics-table td { white-space:normal; overflow-wrap:anywhere; }
  .analytics-alert { border-left:3px solid var(--accent); padding:8px 12px; margin:8px 0; background:var(--panel); }
  .support-entry { display:flex; justify-content:space-between; gap:12px; align-items:center; margin:10px 0; }
  textarea { width:100%; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:10px; font:inherit; }
  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgba(10,15,25,.4); z-index: 20; }
  .drawer { position: fixed; top: 0; right: 0; height: 100%; width: 460px; max-width: 100vw;
    background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow);
    z-index: 21; display: flex; flex-direction: column; }
  .drawer header { position: static; }
  .drawer .body { padding: 18px 20px; overflow-y: auto; flex: 1; }
  .drawer .foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mods { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
  .mods .opt { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
  .mods .opt input { width: auto; }
  .mods .opt.dep label { color: var(--muted); }
  .usage { font-size: 12.5px; }
  .usage div { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px dashed var(--line); }
  .danger-zone { margin-top: 22px; border: 1px solid color-mix(in srgb, var(--danger) 40%, var(--line)); border-radius: 9px; padding: 12px; }
  .danger-zone h3 { margin: 0 0 6px; font-size: 12px; color: var(--danger); text-transform: uppercase; letter-spacing: .04em; }
  .log { margin-top: 20px; font-size: 12px; }
  .log .e { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .log .e .when { color: var(--muted); }

  /* modal */
  .modal { position: fixed; inset: 0; display: grid; place-items: center; z-index: 30; padding: 20px; }
  .modal .card { background: var(--panel); border-radius: 14px; box-shadow: var(--shadow);
    width: 100%; max-width: 400px; padding: 22px; }
  .modal h2 { margin: 0 0 12px; font-size: 16px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 8px; z-index: 40; font-size: 13px; }
  .console-label { font-weight:400; font-size:12px; color:var(--muted); margin-left:12px; }
  .console-shell { display:grid; grid-template-columns:252px minmax(0,1fr); max-width:none; padding:0; min-height:calc(100vh - 61px); }
  .tenant-sidebar { background:var(--panel); border-right:1px solid var(--line); padding:24px 16px; position:sticky; top:61px; height:calc(100vh - 61px); display:flex; flex-direction:column; gap:18px; }
  .sidebar-heading,.sidebar-actions { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .sidebar-heading strong { font-size:13px; }.sidebar-heading span { font-size:11px; }.sidebar-actions .btn { font-size:12px; padding:9px 10px; }
  .tenant-list { overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:6px; }.sidebar-refresh { font-size:12px; }
  .tenant-choice { text-align:left; border:1px solid transparent; border-radius:10px; padding:14px 12px; background:transparent; color:var(--ink); width:100%; }
  .tenant-choice:hover { background:var(--chip); }.tenant-choice.selected { background:color-mix(in srgb,var(--accent) 9%,var(--panel)); border-color:color-mix(in srgb,var(--accent) 35%,var(--line)); }
  .tenant-choice strong { display:block; font-size:13px; overflow-wrap:anywhere; }.tenant-choice .tenant-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:7px; font-size:11px; color:var(--muted); }
  .tenant-workspace { min-width:0; padding:32px 36px; max-width:1600px; width:100%; margin:0 auto; }.dashboard-empty { padding:80px 20px; text-align:center; }
  .tenant-page-heading { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:24px; }.tenant-page-heading h2 { font-size:26px; letter-spacing:-.7px; margin:0 0 4px; }.tenant-page-heading p { margin:0; font-size:12px; }
  .tenant-title-line { display:flex; align-items:center; gap:12px; }.tenant-tabs { display:flex; gap:24px; border-bottom:1px solid var(--line); margin-bottom:24px; overflow-x:auto; }
  .tenant-tabs button { padding:12px 2px; border:0; border-bottom:2px solid transparent; background:none; color:var(--muted); font-size:13px; white-space:nowrap; }.tenant-tabs button.active { color:var(--accent); border-color:var(--accent); font-weight:650; }
  .analytics-card { min-width:0; }.analytics-card>.analytics-heading { display:none; }.analytics-card>p { font-size:11px; margin-bottom:20px; }
  .analytics-section { border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:20px; margin:18px 0; }.analytics-section h3 { font-size:14px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-bottom:20px; }.kpi { border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:20px; }.kpi-label { font-size:11px; color:var(--muted); }.kpi-value { font-size:29px; font-weight:700; letter-spacing:-1px; margin:8px 0 3px; }.kpi-note { font-size:11px; color:var(--muted); }
  .chart-grid { display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:18px; }.chart-card { border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:22px; min-width:0; }.chart-card h3 { font-size:14px; margin:0; }.chart-card p { font-size:11px; color:var(--muted); margin:5px 0 16px; }
  .chart-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }.chart-heading select { width:auto; font-size:12px; padding:6px; }.chart-svg { width:100%; height:auto; display:block; }.chart-svg text { fill:var(--muted); font-size:11px; }.chart-empty { min-height:200px; display:grid; place-items:center; text-align:center; color:var(--muted); font-size:12px; }.chart-legend { display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin:12px 0 0; }.chart-legend span:before { content:''; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--series); margin-right:6px; }
  .module-bar { margin:16px 0; }.bar-heading { display:flex; justify-content:space-between; font-size:12px; gap:12px; margin-bottom:7px; }.bar-track { height:7px; background:var(--chip); border-radius:8px; overflow:hidden; }.bar-fill { height:100%; border-radius:8px; background:var(--accent); min-width:0; }
  .settings-panel { max-width:850px; }.settings-panel .body { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px; }.settings-panel .foot { display:flex; gap:10px; padding:18px 0; }.settings-panel .usage { display:none; }
  .subscription-card { max-width:850px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px; }.subscription-card h2 { font-size:18px; margin-top:0; }
  .support-entry { border:1px solid var(--line); padding:18px; border-radius:10px; margin-top:14px; }.ticket-reply { border-left:3px solid var(--accent); padding:8px 12px; margin:12px 0; font-size:12px; }.support-entry select { margin-bottom:12px; }.support-entry textarea { margin-bottom:10px; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
  @media(max-width:1050px) { .console-shell { grid-template-columns:220px minmax(0,1fr); }.tenant-workspace { padding:24px; }.kpi-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }.chart-grid { grid-template-columns:1fr; } }
  @media(max-width:650px) { .console-shell { display:block; }.tenant-sidebar { position:static; height:auto; border-right:0; border-bottom:1px solid var(--line); padding:16px; gap:12px; }.tenant-list { max-height:180px; }.sidebar-refresh { align-self:flex-start; }.tenant-workspace { padding:20px 16px; }.tenant-page-heading { align-items:flex-start; flex-wrap:wrap; }.tenant-tabs { gap:20px; }.kpi { padding:16px; }.kpi-value { font-size:25px; }.chart-card { padding:16px; }.row2 { grid-template-columns:1fr; } }
  /* billing (billing.js) */
  .badge-row { display:inline-flex; gap:4px; flex-wrap:wrap; }
  .badge.awaiting, .badge.payment_submitted, .badge.pending { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .badge.open { background: var(--chip); color: var(--ink); }
  .badge.paid, .badge.confirmed { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .badge.void { background: var(--chip); color: var(--muted); text-decoration: line-through; }
  .badge.overdue, .badge.rejected { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
  .badge.inq-new { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .badge.inq-contacted { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .badge.inq-won { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .badge.inq-lost { background: var(--chip); color: var(--muted); }
  .field label input[type="checkbox"] { width: auto; margin: 0 8px 0 0; vertical-align: middle; }
  .count-pill { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 11px; padding: 0 7px; margin-left: 6px; }
  .billing-view { padding: 24px; max-width: 1200px; margin: 0 auto; }
  .billing-view .toolbar { flex-wrap: wrap; }
  .billing-table-wrap { overflow-x: auto; }
  .billing-table-wrap table tbody tr { cursor: pointer; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sums { font-size: 13px; border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; }
  .sums div { display: flex; justify-content: space-between; padding: 2px 0; font-variant-numeric: tabular-nums; }
  .sums div.total { font-weight: 700; border-top: 1px solid var(--line); margin-top: 4px; padding-top: 6px; }
  .pay { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
  .pay .acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .btn.small { padding: 5px 10px; font-size: 12.5px; }
  textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%; min-height: 84px; resize: vertical; }
  .price-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .price-grid label { font-weight: 400; font-size: 12px; }
  .awaiting-note { border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
</style>
</head>
<body>

<section id="login">
  <form class="card" id="login-form">
    <h1>OTOM <span class="console-label">Owner console</span></h1>
    <div class="muted">Operator sign-in</div>
    <label for="lu">Username</label>
    <input id="lu" autocomplete="username" autofocus>
    <label for="lp">Password</label>
    <input id="lp" type="password" autocomplete="current-password">
    <button class="btn" type="submit">Sign in</button>
    <div class="err" id="login-err"></div>
  </form>
</section>

<div id="app" class="hidden">
  <header>
    <h1>OTOM <span class="console-label">Owner console</span></h1>
    <span class="muted" id="who"></span>
    <button class="btn ghost" id="mail-btn">Email alerts</button>
    <button class="btn ghost" id="inquiries-btn">Inquiries<span class="count-pill hidden" id="inquiry-count"></span></button>
    <button class="btn ghost" id="billing-btn">Billing<span class="count-pill hidden" id="review-count"></span></button>
    <button class="btn ghost" id="password-btn">Change password</button>
    <button class="btn ghost" id="logout">Log out</button>
  </header>
  <main class="console-shell">
    <aside class="tenant-sidebar" aria-label="Tenants">
      <div class="sidebar-heading"><strong>Tenants</strong><span class="muted" id="count"></span></div>
      <label class="sr-only" for="filter">Search tenants</label><input id="filter" placeholder="Search tenants…">
      <div class="sidebar-actions"><button class="btn" id="new-btn">+ New tenant</button><button class="btn ghost" id="import-btn">Import</button></div>
      <div id="rows" class="tenant-list"></div>
      <button class="btn ghost sidebar-refresh" id="refresh-btn">Refresh tenants</button>
    </aside>
    <section id="tenant-workspace" class="tenant-workspace" aria-label="Tenant dashboard"><div class="dashboard-empty"><h2>Your tenants, at a glance.</h2><p class="muted">Select a tenant to explore its activity, capacity, and service health.</p></div></section>
  </main>
  <section id="billing-view" class="billing-view hidden" aria-label="Billing"></section>
  <section id="inquiries-view" class="billing-view hidden" aria-label="Inquiries"></section>
</div>

<script src="app.js"></script>
<script src="billing.js"></script>
<script src="inquiries.js"></script>
<script src="mail.js"></script>
</body>
</html>
